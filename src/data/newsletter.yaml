conferencesTitle: Conferences and workshops
omitOpportunityIds: []
featured:
  kicker: Due October 19–23
  title: NSF Graduate Research Fellowship Program
  summary: >-
    Three years of support over a five-year period for research-based master’s
    or doctoral study in STEM. Application due dates run October 19–23, 2026,
    by field of study. Mathematical sciences is October 23.
  href: https://www.nsf.gov/funding/initiatives/grfp
  hrefLabel: GRFP application
notes:
  - title: Get involved
    body: >-
      Undergraduate and graduate students are welcome, including students
      outside CMOR. Come to chapter events, or use the contact page if you
      want to help organize.
    href: /get-involved
    hrefLabel: How to take part
  - title: SIAM student membership
    body: >-
      Chapter events do not require SIAM membership. SIAM offers its own
      student membership, which can be free or discounted.
    href: https://www.siam.org/membership/individual-membership/student-membership/
    hrefLabel: SIAM student membership
resources:
  title: Other places to look
  items:
    - label: SIAM Career Center
      href: https://jobs.siam.org/
      note: Internships, postdocs, and jobs posted with SIAM.
    - label: SIAM conferences and events
      href: https://www.siam.org/conferences-events/
      note: SIAM meetings, workshops, and conference calendar.
    - label: Rice Center for Career Development
      href: https://ccd.rice.edu/students/career-opportunities/internships-jobs
      note: Internships, jobs, and 12twenty for Rice students.
    - label: GPS Fellowship Coaching
      href: https://graduate.rice.edu/resources/fellowship-coaching
      note: One-on-one coaching for Rice graduate students applying to major external fellowships.
