# Printable flyer: /newsletter. Plain-text email: /newsletter/email. Not in the header.
# Events, internships, jobs, and fellowships come from the site collections as of `asOf`.
# Workshops and conferences the chapter does not host come from `src/content/conferences/`.
# To feature the next gathering, set featured.eventId to the events collection id.
# Pub nights are at Valhalla, under Keck Hall.

id: 2026-10
issue: 2
month: October 2026
headline: Newsletter
greeting: Hi, Rice SIAM.
intro: >-
  October listings include fellowship deadlines and the SIAM Texas–Louisiana
  Sectional Meeting in Dallas.
subject: 'Rice SIAM — October 2026: NSF GRFP, fellowships, and the Texas–Louisiana meeting'
