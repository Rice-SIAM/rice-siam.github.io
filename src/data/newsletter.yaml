# Printable flyer: /newsletter. Plain-text email: /newsletter/email. Not in the header.
# Events, internships, and jobs come from the site collections as of `asOf`.
# Related workshops go in `meetings` (not src/content/events/) unless the chapter hosts them.
# To feature the next gathering, set featured.eventId to the events collection id.
# Time for pub night is omitted until it is confirmed. Pub nights are at Valhalla, under Keck Hall.

